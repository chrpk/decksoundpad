name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, Test, Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enable Corepack
        run: corepack enable

      - name: Read package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "DECKSOUNDPAD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate release package
        run: corepack pnpm run validate:release

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: decksoundpad-plugin-package
          path: |
            out/DeckSoundpad-v${{ env.DECKSOUNDPAD_VERSION }}-full.zip
            out/DeckSoundpad-v${{ env.DECKSOUNDPAD_VERSION }}-full.zip.sha256
          if-no-files-found: error
          retention-days: 14
