name: Bug Report
description: Report a reproducible DeckSoundpad problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private security details, exploit steps, private paths, usernames, or unredacted logs in public issues. Use SECURITY.md for vulnerability reports and docs/DIAGNOSTICS.md to collect safe support data.
  - type: input
    id: plugin-version
    attributes:
      label: DeckSoundpad version
      placeholder: "0.1.28 or commit SHA"
    validations:
      required: true
  - type: input
    id: steamos-version
    attributes:
      label: SteamOS version
      placeholder: "Settings > System > OS Version"
    validations:
      required: true
  - type: dropdown
    id: deck-model
    attributes:
      label: Steam Deck model
      options:
        - LCD
        - OLED
        - Other / unknown
    validations:
      required: true
  - type: input
    id: decky-version
    attributes:
      label: Decky Loader version
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Installation source
      options:
        - GitHub release ZIP
        - Local development build
        - Decky Store / plugin index
        - Other / unknown
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Decky panel
        - Audio routing
        - Real mic passthrough
        - External overlay
        - Sound library
        - Packaging/install
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps from a fresh Decky session when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Logs may contain local usernames, paths, and audio device names. Redact private data before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not include private security details, exploit steps, private paths, usernames, or unredacted logs in this public issue.
          required: true
        - label: I ran Restart DeckSoundpad before collecting logs.
        - label: I selected `DeckSoundpad mic` in the target voice app.
        - label: I redacted local usernames, private paths, device names, and unrelated log lines.
          required: true
        - label: I reviewed `docs/DIAGNOSTICS.md` for the relevant commands and redaction guidance.
          required: true
