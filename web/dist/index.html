<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeckSoundpad</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title-stack">
          <p id="build-datetime" class="build-meta">Build development build</p>
          <h1>DeckSoundpad</h1>
          <p id="status-text">Connecting</p>
          <p id="ws-status">WebSocket status</p>
        </div>
        <button id="stop-all" class="danger">Stop All</button>
      </header>

      <section class="controls">
        <input id="search" type="search" placeholder="Search sounds" autocomplete="off" />
        <label>
          Volume
          <input id="volume" type="range" min="0" max="150" value="100" />
        </label>
      </section>

      <nav id="categories" class="categories" aria-label="Categories"></nav>
      <section id="grid" class="grid" aria-live="polite"></section>

      <section class="log-panel" aria-label="Logs">
        <div class="log-header">
          <div>
            <h2>Logs</h2>
            <p id="log-status">Local activity and daemon log tail</p>
          </div>
          <button id="refresh-logs">Refresh</button>
        </div>
        <pre id="logs">Waiting for daemon connection...</pre>
      </section>

      <footer class="footer">
        <span id="audio-status">Audio status unknown</span>
        <button id="repair">Repair</button>
      </footer>
    </main>

    <script>
      window.DECKSOUNDPAD_BUILD_DATETIME = "2026-06-14T21:41:16.006Z";
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
